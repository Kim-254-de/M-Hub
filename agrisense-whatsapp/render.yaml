services:
  - type: web
    name: agrisense-whatsapp
    runtime: python
    buildCommand: ./build.sh
    # Threads let the bot reply in the background while Meta gets a fast 200.
    startCommand: gunicorn agrisense.wsgi --workers 2 --threads 4 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agrisense-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: MPESA_CALLBACK_TOKEN
        generateValue: true
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_ACCESS_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: CROP_HEALTH_API_KEY
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
databases:
  - name: agrisense-db
    plan: free
